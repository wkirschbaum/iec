# Fly.io: https://iec-results.fly.dev
# Secrets (set with `fly secrets set`, never committed): DATABASE_URL, SECRET_KEY_BASE.

app = "iec-results"
primary_region = "jnb"
kill_signal = "SIGTERM"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "iec-results.fly.dev"
  PORT = "8080"
  ECTO_IPV6 = "true"
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  POOL_SIZE = "15"

[http_service]
  internal_port = 8080
  force_https = true
  # The app polls the IEC around the clock, so it must keep running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/"
    # Fly's proxy normally adds this; without it Phoenix redirects the check to HTTPS.
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
